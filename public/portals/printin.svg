<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Brand Gradient: Electric Cobalt to Deep Sapphire -->
    <linearGradient id="printinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Specular Hairline Rim for Tactile Depth -->
    <linearGradient id="printinRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Paper Fold Facet Lighting -->
    <linearGradient id="printinFold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Soft Mark Elevation Shadow -->
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#printinBg)" />

  <!-- Specular Top Rim -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="url(#printinRim)" stroke-width="4" />

  <!-- Centered Mark Group -->
  <g filter="url(#markShadow)">
    <!-- 3 Horizontal Paper-Feed Speed Lines -->
    <g fill="#ffffff">
      <!-- Top Speed Line -->
      <rect x="136" y="214" width="64" height="15" rx="7.5" />
      <!-- Middle Speed Line -->
      <rect x="152" y="246" width="48" height="15" rx="7.5" />
      <!-- Bottom Speed Line -->
      <rect x="170" y="278" width="30" height="15" rx="7.5" />
    </g>

    <!-- Main 'P' Loop Body (EvenOdd compound path) -->
    <path fill="#ffffff" fill-rule="evenodd" clip-rule="evenodd" d="
      M 214 162
      C 214 157.58 217.58 154 222 154
      L 302 154
      C 346.18 154 382 189.82 382 234
      C 382 278.18 346.18 314 302 314
      L 258 314
      L 258 280
      L 214 280
      L 214 162
      Z
      M 258 198
      L 298 198
      C 317.88 198 334 214.12 334 234
      C 334 253.88 317.88 270 298 270
      L 258 270
      L 258 198
      Z
    " />

    <!-- Stem and Fold Architecture -->
    <!-- Solid Upper Stem Segment -->
    <rect x="214" y="280" width="44" height="34" fill="#ffffff" />

    <!-- Lower Stem with Diagonal Origami Cut -->
    <path d="
      M 214 314
      L 258 314
      L 258 358
      C 258 359.5 257 360.2 255.8 359.5
      L 214 326
      Z
    " fill="#ffffff" />

    <!-- Distinctive Folded Page Flap -->
    <path d="
      M 214 326
      L 258 358
      L 214 358
      Z
    " fill="url(#printinFold)" />
  </g>
</svg>