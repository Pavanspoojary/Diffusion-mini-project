<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6fffa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#5eead4" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Graduation Cap Icon -->
  <g fill="url(#capGrad)" transform="translate(256, 256)">
    <!-- Main Diamond / Mortarboard -->
    <path d="M 0 -85 L 175 -5 L 0 75 L -175 -5 Z" filter="url(#shadow)"/>
    
    <!-- Skullcap Base -->
    <path d="M -105 32 L -105 105 C -105 155, 105 155, 105 105 L 105 32 C 75 52, -75 52, -105 32 Z" opacity="0.95"/>
    
    <!-- Tassel Button -->
    <circle cx="0" cy="-5" r="14" fill="#fef08a"/>
    
    <!-- Tassel String and Fringe -->
    <path d="M 0 -5 Q 120 -5 145 60" fill="none" stroke="#fef08a" stroke-width="8" stroke-linecap="round"/>
    <rect x="135" y="60" width="20" height="48" rx="6" fill="#fde047"/>
  </g>
</svg>
