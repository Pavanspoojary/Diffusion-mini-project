<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Brand Gradient: Electric Flame to Deep Coral Crimson -->
    <linearGradient id="edminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6e26" />
      <stop offset="40%" stop-color="#ff4800" />
      <stop offset="100%" stop-color="#cf2000" />
    </linearGradient>

    <!-- Top Ambient Gloss Sheen -->
    <radialGradient id="edminGlow" cx="50%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Hairline Rim for Tactile Edge -->
    <linearGradient id="edminRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Tactile Elevation Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4d0b00" flood-opacity="0.38" />
    </filter>

    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe2cc" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#edminBg)" />

  <!-- Inner Ambient Gloss Sheen -->
  <rect width="512" height="512" rx="118" fill="url(#edminGlow)" />

  <!-- Specular Top Rim -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="url(#edminRim)" stroke-width="4" />

  <!-- Centered Mark Group -->
  <g filter="url(#markShadow)">
    <!-- Geometric 'e' Outer & Inner (Uniform Stroke = 40, R=122, r=82, cx=256, cy=266) -->
    <path fill="#ffffff" fill-rule="evenodd" clip-rule="evenodd" d="
      M 256 144
      C 323.38 144 378 198.62 378 266
      C 378 274.84 370.84 282 362 282
      L 175.5 282
      C 180.2 318.8 214.2 348 256 348
      C 285.5 348 311.2 333.5 326.5 311.2
      C 331.4 304.1 341.2 302.2 348.5 307
      C 355.8 311.8 357.8 321.8 352.8 329
      C 331.5 360 296 380 256 380
      C 193.04 380 142 328.96 142 266
      C 142 203.04 193.04 144 256 144
      Z
      M 175.5 250
      L 344 250
      C 340 210.5 302.5 176 256 176
      C 209.5 176 179.5 210.5 175.5 250
      Z
    " />

    <!-- Signature Floating Brand Dot -->
    <circle cx="362" cy="156" r="22" fill="url(#dotGrad)" />
  </g>
</svg>