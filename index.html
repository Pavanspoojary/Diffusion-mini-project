<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Campus Hub - Real-time Notices, Events & Resources">
  <title>SMVITM Campus Hub</title>
  <link rel="icon" type="image/png" href="/smvitm-logo.png">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    // Automatic self-recovery when encountering stale service-worker chunk 404s
    window.addEventListener('error', function(event) {
      var target = event.target;
      if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
        var src = target.src || target.href;
        if (src && src.indexOf('/assets/') !== -1) {
          if (!sessionStorage.getItem('chunk_load_failed')) {
            sessionStorage.setItem('chunk_load_failed', '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).then(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        }
      }
    }, true);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
